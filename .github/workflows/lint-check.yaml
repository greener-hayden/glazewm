name: Checks

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  lint-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # MacOS (Apple Silicon)
          - platform: macos-latest
            target: aarch64-apple-darwin
          # Windows (x64)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
          toolchain: nightly

      - uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          shared-key: ${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting (rustfmt)
        run: cargo fmt --check

      # Clippy itself runs `cargo check`, so this will also check for compilation errors.
      - name: Check linting (clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Both platforms are first-class here, so both run the suite. This is the
  # only gate that exercises the platform the author is not sitting at.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # MacOS (Apple Silicon). `wm-watcher` is Windows-only and its
          # build script panics elsewhere, so `--workspace` must skip it.
          - platform: macos-latest
            target: aarch64-apple-darwin
            exclusions: --exclude wm-watcher
          # Windows (x64)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            exclusions: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          targets: ${{ matrix.target }}
          toolchain: nightly

      - uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          shared-key: ${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      # `--test-threads=1` is required, not a preference: wm-platform's
      # harness runs its tests on the main thread because macOS UI APIs
      # demand it, and returns NotMainThread otherwise. See its src/test.rs.
      - name: Run tests
        run: >-
          cargo test --workspace --all-features ${{ matrix.exclusions }}
          -- --test-threads=1
