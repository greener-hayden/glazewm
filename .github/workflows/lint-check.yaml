name: Checks

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  lint-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # MacOS (Apple Silicon)
          - platform: macos-latest
            target: aarch64-apple-darwin
          # Windows (x64)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
          toolchain: nightly

      - uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          shared-key: ${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting (rustfmt)
        run: cargo fmt --check

      # Clippy itself runs `cargo check`, so this will also check for compilation errors.
      - name: Check linting (clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Both platforms are first-class here, so both run the suite. This is the
  # only gate that exercises the platform the author is not sitting at.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # MacOS (Apple Silicon). Two crates are skipped, for different
          # reasons.
          #
          # `wm-watcher` is Windows-only and its build script panics
          # elsewhere by design, so `--workspace` has to leave it out.
          #
          # `wm-platform`'s own test binary needs a real desktop session.
          # Run in parallel its event-loop and display tests fail with
          # `NotMainThread`, because macOS demands the main thread for
          # those APIs. Run serially with `--test-threads=1`, which is
          # what its `src/test.rs` asks for, `event_loop.run()` never
          # returns on a headless runner and the job hangs until killed.
          # Its compile coverage comes from clippy above, which does run
          # on macOS; the tests themselves are only meaningful on a real
          # desktop.
          - platform: macos-latest
            target: aarch64-apple-darwin
            test-args: --exclude wm-watcher --exclude wm-platform
          # Windows (x64) runs everything, in parallel. The main-thread
          # requirement is macOS-only, and serializing here would instead
          # share one thread message queue across every test, so the
          # dispatcher tests observe each other's leftover messages.
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            test-args: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          targets: ${{ matrix.target }}
          toolchain: nightly

      - uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          shared-key: ${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      # Deliberately not `--all-features`. The only features here are
      # wm-platform's `test_utils`, which dev-dependencies already enable,
      # and wm's `ui_access`, which stamps uiAccess=true into the manifest
      # so the binary refuses to launch unelevated (os error 740).
      - name: Run tests
        run: cargo test --workspace ${{ matrix.test-args }}
