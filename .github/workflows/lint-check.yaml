name: Checks

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  lint-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # MacOS (Apple Silicon)
          - platform: macos-latest
            target: aarch64-apple-darwin
          # Windows (x64)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
          toolchain: nightly

      - uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          shared-key: ${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting (rustfmt)
        run: cargo fmt --check

      # Clippy itself runs `cargo check`, so this will also check for compilation errors.
      - name: Check linting (clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Both platforms are first-class here, so both run the suite. This is the
  # only gate that exercises the platform the author is not sitting at.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # MacOS (Apple Silicon). `wm-watcher` is Windows-only and its
          # build script panics elsewhere, so `--workspace` must skip it.
          #
          # `--test-threads=1` keeps wm-platform's tests on the main
          # thread, which macOS UI APIs require; without it they fail with
          # `NotMainThread`. See that crate's `src/test.rs`.
          - platform: macos-latest
            target: aarch64-apple-darwin
            test-args: --exclude wm-watcher -- --test-threads=1
          # Windows (x64). Deliberately left parallel: the main-thread
          # requirement above is macOS-only, and serializing here instead
          # shares one thread message queue across every test, so the
          # dispatcher tests observe each other's leftover messages.
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            test-args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          targets: ${{ matrix.target }}
          toolchain: nightly

      - uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          shared-key: ${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      # Deliberately not `--all-features`. The only features here are
      # wm-platform's `test_utils`, which dev-dependencies already enable,
      # and wm's `ui_access`, which stamps uiAccess=true into the manifest
      # so the binary refuses to launch unelevated (os error 740).
      - name: Run tests
        run: cargo test --workspace ${{ matrix.test-args }}
