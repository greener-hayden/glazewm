[workspace]
resolver = "2"
members = ["packages/*"]
default-members = ["packages/wm", "packages/wm-cli"]

[workspace.dependencies]
anyhow = { version = "1", features = ["backtrace"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
home = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tauri-winres = "0.1"
thiserror = "2"
regex = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "fast-rng", "serde"] }
wm-macros = { path = "packages/wm-macros" }

# The WM is a resident process whose hot paths cross crate boundaries
# (`wm` into `wm-platform` and `wm-common`). Thin LTO and a single codegen
# unit let those calls inline; the cost is a longer release build. Line
# tables keep backtraces in the error log readable.
[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[workspace.lints]
clippy.all = { level = "warn", priority = -1 }
clippy.pedantic = { level = "warn", priority = -1 }
clippy.missing_errors_doc = "allow"
